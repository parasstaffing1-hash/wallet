name: Build Wallet desktop installer

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.mjs"
      - ".eslintrc.json"
      - ".eslintignore"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1

      - name: Build static wallet UI
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm check:production
          pnpm exec tsc --noEmit
          pnpm lint
          pnpm test:crypto
          pnpm build

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Build native Windows app
        run: pnpm desktop:build -- --ci

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Generate installer checksum
        shell: pwsh
        run: Get-FileHash src-tauri/target/release/bundle/nsis/*.exe -Algorithm SHA256 | Format-List
