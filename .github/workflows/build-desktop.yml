name: Build Wallet desktop installer

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "src-tauri/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.mjs"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build static wallet UI
        run: |
          npm install --ignore-scripts
          npm run build

      - name: Build native Windows app
        run: npx --yes @tauri-apps/cli@2.11.4 build --ci

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Wallet-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
